[project]
name = "tb_owlai_core"
authors = [
    { name = "TechBirdIt.in", email = "ekansh.jain@techbirdit.in"}
]
description = "Native Intelligence Layer"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project.optional-dependencies]
# Direct GGUF inference without Ollama. Install with:
#   pip install llama-cpp-python
# For GPU acceleration see: https://github.com/abetlen/llama-cpp-python#installation-with-specific-hardware-acceleration
llama = ["llama-cpp-python>=0.2.0"]

# Fast KNN vector search via sqlite-vec. Install with:
#   pip install sqlite-vec
vec = ["sqlite-vec>=0.1.0"]

# ONNX embedding fallback when Ollama is unavailable. Install with:
#   pip install fastembed
# Downloads BAAI/bge-small-en-v1.5 (~130MB) on first use (CPU-only).
onnx = ["fastembed>=0.2.0"]

# All optional inference/vector backends
all-inference = ["llama-cpp-python>=0.2.0", "sqlite-vec>=0.1.0", "fastembed>=0.2.0"]

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
